<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>OCX - Secure Encrypted Texts/Images</title>
    <meta name="description" content="Privacy-focused encrypted message & images app. Secure text encryption with local processing—no data storage, 100% private.">
    <meta name="author" content="OCX" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OCX" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cozy-cipher-chat.lovable.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@OCX_App" />
    <meta name="twitter:image" content="https://cozy-cipher-chat.lovable.app/og-image.png" />
    
  
  
  
  <meta property="og:title" content="OCX - Secure Encrypted Texts/Images">
  <meta name="twitter:title" content="OCX - Secure Encrypted Texts/Images">
  <meta property="og:description" content="Privacy-focused encrypted message &amp; images app. Secure text encryption with local processing—no data storage, 100% private.">
  <meta name="twitter:description" content="Privacy-focused encrypted message &amp; images app. Secure text encryption with local processing—no data storage, 100% private.">
</head>

  <body>
    <div id="root">
      <!-- Immediate loading state - shows before React mounts -->
      <!-- This prevents blank screen on slow devices / iOS -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, hsl(225 25% 8%) 0%, hsl(225 20% 12%) 100%);
        gap: 16px;
        z-index: 9999;
      ">
        <img 
          src="/icon-192.png" 
          alt="OCX" 
          width="64" 
          height="64"
          style="animation: pulse 2s ease-in-out infinite;"
        />
        <div style="
          display: flex;
          align-items: center;
          gap: 12px;
          color: hsl(215 20% 65%);
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 14px;
        ">
          <div style="
            width: 20px;
            height: 20px;
            border: 2px solid hsl(262 83% 58%);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "></div>
          <span>Loading OCX...</span>
        </div>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.7; transform: scale(0.95); }
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
